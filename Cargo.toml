[package]
name = "chrome-agent-search"
version = "0.1.0"
edition = "2024"
description = "Search and read web pages through chrome-agent"
license = "MIT"
repository = "https://github.com/ominiverdi/chrome-agent-search"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
urlencoding = "2.1"
