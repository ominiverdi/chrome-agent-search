name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            binary: chrome-agent-search
            archive: tar.gz
          - name: macos-arm64
            os: macos-latest
            binary: chrome-agent-search
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            binary: chrome-agent-search.exe
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --release
      - name: Package Unix
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.binary }} dist/
          cp README.md LICENSE dist/
          tar -C dist -czf chrome-agent-search-${{ matrix.name }}.tar.gz .
      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/${{ matrix.binary }} dist/
          Copy-Item README.md,LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath chrome-agent-search-${{ matrix.name }}.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-agent-search-${{ matrix.name }}
          path: |
            chrome-agent-search-${{ matrix.name }}.tar.gz
            chrome-agent-search-${{ matrix.name }}.zip
          if-no-files-found: ignore

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
